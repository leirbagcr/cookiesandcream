<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cookie's Top · Controle de Vendas</title>
  <meta name="description" content="Painel de controle de vendas, estoque e lucro da Cookie's Top." />
  <meta name="theme-color" content="#5C1A2B" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></symbol>
    <symbol id="i-pos" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8V5h10v3"/><path d="M8 13h3M8 16.5h7"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3H9.8l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4.4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.06-.4.1-.8.1-1.2Z"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6"/><circle cx="9" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M16 12h4M3 10h18"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z"/><path d="M12 9v5M12 17.2v.3"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#dashboard" data-view="dashboard">
        <img class="brand-logo" src="assets/logo.svg" alt="" />
        <span class="brand-text">
          <strong id="brand-name">Cookie's Top</strong>
          <small>Controle da loja</small>
        </span>
      </a>

      <nav class="nav" aria-label="Navegação principal">
        <button class="nav-btn" data-view="dashboard"><svg class="icon"><use href="#i-home"/></svg>Início</button>
        <button class="nav-btn" data-view="pdv"><svg class="icon"><use href="#i-pos"/></svg>Vendas</button>
        <button class="nav-btn" data-view="estoque"><svg class="icon"><use href="#i-box"/></svg>Estoque</button>
        <button class="nav-btn" data-view="historico"><svg class="icon"><use href="#i-receipt"/></svg>Histórico</button>
        <button class="nav-btn" data-view="relatorios"><svg class="icon"><use href="#i-chart"/></svg>Relatórios</button>
        <button class="nav-btn" data-view="config"><svg class="icon"><use href="#i-gear"/></svg>Ajustes</button>
      </nav>

      <div class="sidebar-foot">
        <span>Estoque total</span>
        <strong id="sidebar-stock">80 un.</strong>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <div class="mobile-brand"><img src="assets/logo.svg" alt="" /><span id="mobile-brand-name">Cookie's Top</span></div>
          <p class="eyebrow">Cookie's Top · Painel</p>
          <h1 id="page-title">Início</h1>
          <p class="page-sub" id="page-subtitle">Visão geral da loja</p>
        </div>
        <div class="topbar-actions">
          <span class="date-chip"><svg class="icon"><use href="#i-calendar"/></svg><span id="date-chip"></span></span>
          <button class="btn btn-primary" data-view="pdv">
            <svg class="icon"><use href="#i-plus"/></svg>Nova venda
          </button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toasts" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;font-family:sans-serif">Ative o JavaScript no navegador para usar o painel da Cookie's Top.</p>
  </noscript>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
